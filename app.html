<script>
/* ⚡ 자동 로그인 선발사 — 스크립트·폰트 로딩과 서버 왕복(1~2초)을 병렬로 진행 */
(function(){
  try{
    var raw = localStorage.getItem("gu3.auth");
    /* ⚡ 로그인 화면 선발사 — 시설을 알면 명단(getRoster)을 스크립트 로딩과 병렬로 미리 요청.
       저장된 로그인이 있어도 함께 쏜다 — 비밀번호가 초기화된 뒤에는 자동 로그인이 실패하고
       곧바로 로그인 화면이 뜨는데, 그때 명단 왕복을 처음부터 시작하면 2회가 직렬로 늘어난다. */
    var fac = "";
    try{ var m = location.search.match(/[?&]fac=([^&]*)/); if(m) fac = decodeURIComponent(m[1].replace(/\+/g," ")); }catch(e){}
    if(!fac){ try{ fac = JSON.parse(localStorage.getItem("gu3.fac") || "null") || ""; }catch(e){} }
    if(fac && GU.FACILITIES.indexOf(fac) >= 0) window.__earlyRoster = { fac: fac, promise:
      fetch(GU.SHEET_URL, { method:"POST", mode:"cors", headers:{ "Content-Type":"text/plain;charset=utf-8" },
        body: JSON.stringify({ action:"getRoster", fac: fac })
      }).then(function(r){ return r.json(); }) };
    if(!raw) return;
    var a = JSON.parse(decodeURIComponent(atob(raw))); if(!a || !a.uid || !a.pw) return;
    var hasData = false, rosterVer = 0;
    /* ⚡ 대형 캐시(수백 KB)를 통째로 파싱하지 않고 작은 마커 키만 읽음 — fetch 발사가 빨라짐 */
    try{ hasData = Number(localStorage.getItem("gu3.hasData." + a.uid)) === GU.CACHE_SCHEMA && (localStorage.getItem("gu3.data." + a.uid) || "").length > 2; }catch(e){}   /* 🆕 v3.8.8 — 마커만 남고 본문이 없는 기기는 처음부터 전체를 받아 왕복 3회를 1회로 */
    try{ rosterVer = Number(localStorage.getItem("gu3.roster.ver")) || 0; }catch(e){}
    window.__earlyLogin = { uid: a.uid, pw: a.pw, promise:
      fetch(GU.SHEET_URL, { method:"POST", mode:"cors", headers:{ "Content-Type":"text/plain;charset=utf-8" },
        body: JSON.stringify({ action:"loginAndLoad", uid:a.uid, password:a.pw, needRoster:true, rosterVersion:rosterVer, needData:!hasData })
      }).then(function(r){ return r.json(); }) };
  }catch(e){}
})();
</script>

  <div id="bs-fail" style="display:none;margin-top:22px;max-width:300px;font-size:12.5px;line-height:1.7;color:#334155;font-weight:600;">
    화면을 불러오지 못했어요.<br/>인터넷 연결을 확인한 뒤 다시 시도해주세요.
    <div id="bs-fail-detail" style="margin-top:6px;font-size:10.5px;color:#94A3B8;font-weight:500;"></div>
    <button onclick="location.reload()" style="margin-top:12px;padding:10px 22px;border-radius:9999px;border:none;cursor:pointer;color:#fff;font-weight:700;font-size:13px;background:linear-gradient(135deg,#2E4468,#1E2E4A);box-shadow:0 6px 16px rgba(77,110,158,.25);">다시 시도</button>
  </div>
</div>
<script>
/* 안전장치: 스크립트 로드 실패 → 즉시 안내 · 서버 응답 지연 → "연결 중 N초" 표시(실패 아님) · 30초 초과 → 다시 시도 안내 */
(function(){
  var failed = false, started = Date.now();
  function splash(){ var s = document.getElementById("boot-splash"); return (s && !s.classList.contains("bs-hide")) ? s : null; }
  function fail(msg){
    if(failed) return; failed = true;
    var s = splash(); if(!s) return;
    var d = s.querySelector(".bs-dots"); if(d) d.style.display = "none";
    var w = document.getElementById("bs-wait"); if(w) w.style.display = "none";
    var f = document.getElementById("bs-fail"); if(f) f.style.display = "block";
    var dt = document.getElementById("bs-fail-detail"); if(dt && msg) dt.textContent = msg;
  }
  window.addEventListener("error", function(e){
    var m = (e && e.message) || "";
    if(/is not defined|Cannot read|Unexpected/i.test(m)) fail("오류: " + m.slice(0,80));
  });
  var tick = setInterval(function(){
    var s = splash(); if(!s){ clearInterval(tick); return; }
    var sec = Math.round((Date.now() - started) / 1000);
    var missing = [];
    if(typeof React === "undefined") missing.push("React");
    if(typeof ReactDOM === "undefined") missing.push("ReactDOM");          /* 🆕 v3.8.8 */
    if(typeof htm === "undefined") missing.push("htm");
    if(typeof window.GU === "undefined") missing.push("config");
    if(!(window.GU && typeof window.GU.api === "function")) missing.push("api.js");   /* 🆕 v3.8.8 */
    if(!window.__appLoaded) missing.push("app.js");                         /* 🆕 v3.8.8 — 가장 큰 파일(app.js) 로드 실패도 8초 안에 감지 */
    if(sec >= 8 && missing.length){ fail("불러오지 못한 항목: " + missing.join(", ")); clearInterval(tick); return; }
    var pending = (window.GU && window.GU.pending) || 0;
    if(sec >= 4){
      var w = document.getElementById("bs-wait");
      if(w){ w.style.display = "block"; w.textContent = pending > 0 ? ("서버에 연결하는 중이에요 · " + sec + "초") : ("준비 중이에요 · " + sec + "초"); }
    }
    if(sec >= 30){ fail("서버 응답이 너무 늦어요. 잠시 후 다시 시도해주세요."); clearInterval(tick); }
  }, 1000);
})();
</script>
