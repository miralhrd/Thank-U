    <div style="font-size:11px;font-weight:800;color:#64748B;letter-spacing:.1em;text-transform:uppercase;text-align:center;margin-bottom:12px;">소속 시설을 선택해주세요</div>
    <div id="fac-list"></div>
  </div>

  <button id="add-home" class="popIn" style="margin-top:22px;padding:11px 22px;border-radius:9999px;border:1.5px solid #B9CCE3;background:rgba(255,255,255,.75);color:#3F5D8A;font-weight:800;font-size:12.5px;cursor:pointer;display:none;">📲 바탕화면에 추가하고 앱처럼 쓰기</button>
  <div style="margin-top:26px;font-size:10px;color:#94A3B8;font-weight:600;letter-spacing:.12em;text-transform:uppercase;">MIRAL WELFARE FOUNDATION</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){
  var GU = window.GU;

  // ⭐ 자동 로그인 정보가 있으면 랜딩을 건너뛰고 바로 앱으로 (replace → 뒤로가기 루프 방지)
  var saved = GU.loadAuth();
  if(saved && saved.uid && saved.pw){
    location.replace("app.html?v=" + GU.VERSION);
    return;
  }

  var hb = document.getElementById("add-home");
  if(hb && GU.installState && GU.installState() !== "installed"){ hb.style.display = "inline-block"; hb.onclick = function(){ GU.requestInstall(); }; }

  var ICONS = ['<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="ws-soil" x1="0" y1="57" x2="0" y2="80" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6F8DB5"/><stop offset="1" stop-color="#3D5A86"/></linearGradient><linearGradient id="ws-leafL" x1="48" y1="47" x2="25" y2="24" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5F86BE"/><stop offset="1" stop-color="#A9C8EE"/></linearGradient><linearGradient id="ws-leafR" x1="48" y1="47" x2="71" y2="24" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7FA3D3"/><stop offset="1" stop-color="#C6DAF2"/></linearGradient></defs><path d="M20 80 C22 64 34 57 46 57 C58 57 70 64 72 80 Z" fill="url(#ws-soil)"/><path d="M21.6 70.5C23.4 62.4 34.2 57 46 57C57.8 57 68.6 62.4 70.4 70.5C67.2 68.4 63.4 70.4 59.8 68.6C56 70.7 51.6 68.5 47.6 70.1C43.6 68.4 39.2 70.6 35.2 68.7C31.2 70.6 26 68.5 21.6 70.5Z" fill="#fff"/><path d="M48 58 C47.5 53 47.5 49 48 43" fill="none" stroke="#5F86BE" stroke-width="5" stroke-linecap="round"/><path d="M48 47 C36 45 26 36 25 24 C38 24 48 33 48 47 Z" fill="url(#ws-leafL)"/><path d="M48 47 C60 45 70 36 71 24 C58 24 48 33 48 47 Z" fill="url(#ws-leafR)"/><path d="M80 63v14M73.9 66.5l12.2 7M73.9 73.5l12.2-7" stroke="#8DAACB" stroke-width="2.4" stroke-linecap="round"/></svg>', '<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="wb-body" x1="0" y1="36" x2="0" y2="78" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6E9AD4"/><stop offset="1" stop-color="#4A6EA6"/></linearGradient></defs><path d="M35 44 C35 20 61 20 61 44" fill="none" stroke="#2A3F62" stroke-width="5" stroke-linecap="round"/><path d="M40 48 C40 26 56 26 56 48" fill="none" stroke="#3F5D8A" stroke-width="5" stroke-linecap="round"/><rect x="25" y="36" width="46" height="42" rx="7" fill="url(#wb-body)"/><path d="M25 45 V43 C25 39 28 36 32 36 H64 C68 36 71 39 71 43 V45 Z" fill="#3B5A8C"/><path d="M0 4.6 C-5 0.8 -6.2 -2.4 -4.1 -4.4 C-2.3 -6 -0.6 -4.9 0 -3.1 C0.6 -4.9 2.3 -6 4.1 -4.4 C6.2 -2.4 5 0.8 0 4.6 Z" transform="translate(48 60) scale(1.5)" fill="#fff"/></svg>', '<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="wg-strap" x1="0" y1="38" x2="0" y2="78" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C9D7E8"/></linearGradient></defs><rect x="27" y="50" width="42" height="28" rx="5" fill="#4A6EA6"/><rect x="29" y="50" width="38" height="5" fill="#3B5A8C"/><rect x="22" y="38" width="52" height="14" rx="5" fill="#6E9AD4"/><rect x="43" y="38" width="10" height="40" fill="url(#wg-strap)"/><ellipse cx="37" cy="33" rx="9" ry="5.5" transform="rotate(-22 37 33)" fill="#C9D7E8"/><ellipse cx="59" cy="33" rx="9" ry="5.5" transform="rotate(22 59 33)" fill="#C9D7E8"/><circle cx="48" cy="35" r="4.5" fill="#fff"/></svg>'];
  var SUBS = ["법인 본부", "", ""];   // 빈 값이면 회색 줄 자체를 안 만들어 이름이 세로 가운데로 옴
  var listEl = document.getElementById("fac-list");
  GU.FACILITIES.forEach(function(fac, i){
    var btn = document.createElement("button");
    btn.className = "fac-card";
    btn.innerHTML =
      '<div class="fc-icon">' + ICONS[i % ICONS.length] + '</div>' +
      '<div><div class="fc-name">' + fac + '</div>' +
      (SUBS[i] ? '<div class="fc-sub">' + SUBS[i] + '</div>' : '') + '</div>' +
      '<svg class="fc-arrow" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
    btn.addEventListener("click", function(){
      GU.saveFac(fac);
      // 시설을 URL로도 전달 — 저장소가 제한된 환경(사내 브라우저 정책 등)에서도 안전
      location.href = "app.html?fac=" + encodeURIComponent(fac) + "&v=" + GU.VERSION;
    });
    listEl.appendChild(btn);
  });

  // 오늘 쪽지 수 — 60초 로컬 캐시로 서버 재호출 억제
  //  💌 config.js 의 SHOW_TODAY_COUNT 가 true 일 때만 표시·조회 (기본 false = 숨김).
  //     꺼 두면 이 화면에서 서버 요청(getLanding) 자체를 보내지 않습니다.
  function showCount(n){
    if(GU.SHOW_TODAY_COUNT !== true) return;
    document.getElementById("today-count-num").textContent = n;
    document.getElementById("today-count").style.visibility = "visible";
  }
  if(GU.SHOW_TODAY_COUNT === true){
    var cached = null;
    try{ cached = JSON.parse(localStorage.getItem("gu3.landing") || "null"); }catch(e){}
    if(cached && (Date.now() - cached.at) < 60000){
      showCount(cached.n);
    }else{
      GU.api("getLanding").then(function(r){
        if(r && r.ok){
          showCount(r.todayCount || 0);
          try{ localStorage.setItem("gu3.landing", JSON.stringify({ n:r.todayCount||0, at:Date.now() })); }catch(e){}
        }
      });
    }
  }
});
</script>
</body>
</html>
